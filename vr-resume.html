<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Ankit Sharma — Sr. Technology Specialist (Python & OSS Compliance) — interactive 360-degree VR resume. Drag to look around." />
  <title>Ankit Sharma — 360° VR Resume</title>
  <script src="https://unpkg.com/aframe@1.5.0/dist/aframe.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0B1220;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    a-scene { position: fixed; inset: 0; }
    .hint {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      background: rgba(11,18,32,.78); color: #F1E9D2; border: 1px solid rgba(201,169,106,.55);
      font-size: 13.5px; font-weight: 600; letter-spacing: .02em;
      padding: 10px 18px; border-radius: 999px; z-index: 10; white-space: nowrap;
      transition: opacity .8s ease; pointer-events: none;
    }
    .hint.hidden { opacity: 0; }
  </style>
</head>
<body>
  <div class="hint" id="hint">Drag to look around &middot; 360&deg; resume</div>

  <a-scene vr-mode-ui="enabled: true" device-orientation-permission-ui="enabled: true">
    <a-assets>
      <img id="skyTex" src="blue-sky.jpg" crossorigin="anonymous" />
    </a-assets>

    <!-- Environment -->
    <a-sky src="#skyTex"></a-sky>
    <a-entity light="type: ambient; color: #FFFFFF; intensity: 0.95"></a-entity>
    <a-entity light="type: directional; color: #FFF4DE; intensity: 0.7" position="2 6 3"></a-entity>
    <a-circle position="0 0 0" rotation="-90 0 0" radius="9"
              color="#0B1220" opacity="0.55"></a-circle>
    <a-ring position="0 0.01 0" rotation="-90 0 0" radius-inner="2.2" radius-outer="2.32"
            color="#C9A96A" opacity="0.9"></a-ring>
    <a-torus position="0 0.4 0" rotation="90 0 0" radius="3.4" tube="0.015"
             color="#C9A96A" opacity="0.55"
             animation="property: rotation; to: 90 360 0; loop: true; dur: 40000; easing: linear"></a-torus>

    <!-- Camera: stay centered, look around -->
    <a-entity position="0 1.6 0">
      <a-camera look-controls wasd-controls="enabled: false" fov="80"></a-camera>
    </a-entity>

    <!-- FRONT: profile hero -->
    <a-entity position="0 2.1 -4">
      <a-plane width="7.2" height="4.4" color="#0B1220" opacity="0.85"></a-plane>
      <a-plane position="0 2.05 0.01" width="7.2" height="0.1" color="#C9A96A"></a-plane>
      <a-text value="AVAILABLE FOR CONSULTING  |  PUNE / REMOTE" align="center" width="6.4"
              color="#E8C87E" position="0 1.62 0.02"></a-text>
      <a-text value="Ankit Sharma" align="center" width="6.6" color="#FFFFFF"
              position="0 1.12 0.02" scale="1.5 1.5 1"></a-text>
      <a-text value="Sr. Technology Specialist" align="center" width="6.4"
              color="#FFFFFF" position="0 0.52 0.02"></a-text>
      <a-text value="Python and OSS Compliance  |  Amdocs" align="center" width="6.2"
              color="#9FE8D8" position="0 0.14 0.02"></a-text>
      <a-text value="Compliance and code, done elegantly." align="center" width="5.6"
              color="#C7CFE3" position="0 -0.34 0.02"></a-text>
      <a-text value="10+ yrs experience  |  4 companies  |  200+ audits" align="center" width="5.8"
              color="#F1E2C2" position="0 -0.82 0.02"></a-text>
      <a-text value="ankit_998877@yahoo.com" align="center" width="5.2"
              color="#9AA3B7" position="0 -1.28 0.02"></a-text>
      <a-text value="FRONT  |  turn around for journey, skills and contact" align="center" width="5.4"
              color="#5C667D" position="0 -1.78 0.02"></a-text>
    </a-entity>

    <!-- RIGHT: journey -->
    <a-entity position="4 2.1 0" rotation="0 -90 0">
      <a-plane width="7.2" height="4.4" color="#0B1220" opacity="0.85"></a-plane>
      <a-plane position="0 2.05 0.01" width="7.2" height="0.1" color="#4F46E5"></a-plane>
      <a-text value="JOURNEY  |  10 YEARS, 4 COMPANIES" align="center" width="6.2"
              color="#E8C87E" position="0 1.62 0.02"></a-text>
      <a-text value="2021 - Now  |  Amdocs" align="center" width="6"
              color="#FFFFFF" position="0 1.05 0.02"></a-text>
      <a-text value="Sr. Technology Specialist - OSS compliance at scale" align="center" width="5.6"
              color="#C7CFE3" position="0 0.68 0.02"></a-text>
      <a-text value="2019 - 2021  |  Edgeverve Systems" align="center" width="6"
              color="#FFFFFF" position="0 0.18 0.02"></a-text>
      <a-text value="Member, IP Professional - policy meets delivery" align="center" width="5.6"
              color="#C7CFE3" position="0 -0.19 0.02"></a-text>
      <a-text value="2016 - 2019  |  Siemens" align="center" width="6"
              color="#FFFFFF" position="0 -0.66 0.02"></a-text>
      <a-text value="License Management Risk Specialist" align="center" width="5.6"
              color="#C7CFE3" position="0 -1.0 0.02"></a-text>
      <a-text value="2014 - 2016  |  Lyra Infosystems" align="center" width="6"
              color="#FFFFFF" position="0 -1.44 0.02"></a-text>
      <a-text value="Solutions Consultant - the compliance craft" align="center" width="5.6"
              color="#C7CFE3" position="0 -1.78 0.02"></a-text>
    </a-entity>

    <!-- BACK: expertise + skills -->
    <a-entity position="0 2.1 4" rotation="0 180 0">
      <a-plane width="7.2" height="4.4" color="#0B1220" opacity="0.85"></a-plane>
      <a-plane position="0 2.05 0.01" width="7.2" height="0.1" color="#0E9F8A"></a-plane>
      <a-text value="EXPERTISE  |  RELEASE-READY SKILLS" align="center" width="6.2"
              color="#E8C87E" position="0 1.62 0.02"></a-text>
      <a-text value="OSS audits and clearance - Protex, Hub, FOSSology" align="center" width="5.8"
              color="#FFFFFF" position="0 1.08 0.02"></a-text>
      <a-text value="License remediation - GPL, MIT, Apache-2.0" align="center" width="5.8"
              color="#FFFFFF" position="0 0.68 0.02"></a-text>
      <a-text value="Python automation - SBOMs, parsers, dashboards" align="center" width="5.8"
              color="#FFFFFF" position="0 0.28 0.02"></a-text>
      <a-text value="AI-assisted review  |  Web development  |  FOSS training" align="center" width="5.8"
              color="#FFFFFF" position="0 -0.12 0.02"></a-text>
      <a-text value="OSS Compliance 90%  |  Python 75%  |  Vibe Coding 75%" align="center" width="5.6"
              color="#9FE8D8" position="0 -0.66 0.02"></a-text>
      <a-text value="AI 70%  |  Web 70%  |  Black Duck, Code Centre, FOSSology" align="center" width="5.6"
              color="#9FE8D8" position="0 -1.04 0.02"></a-text>
      <a-text value="Exploring: LLM triage, SBOM automation, modern CSS" align="center" width="5.4"
              color="#5C667D" position="0 -1.5 0.02"></a-text>
      <a-text value="Learning will yield earning." align="center" width="5"
              color="#5C667D" position="0 -1.82 0.02"></a-text>
    </a-entity>

    <!-- LEFT: education, interests, contact -->
    <a-entity position="-4 2.1 0" rotation="0 90 0">
      <a-plane width="7.2" height="4.4" color="#0B1220" opacity="0.85"></a-plane>
      <a-plane position="0 2.05 0.01" width="7.2" height="0.1" color="#C9A96A"></a-plane>
      <a-text value="CONNECT  |  EDUCATION AND BEYOND" align="center" width="6.2"
              color="#E8C87E" position="0 1.62 0.02"></a-text>
      <a-text value="PICT Pune - B.E. in IT" align="center" width="6"
              color="#FFFFFF" position="0 1.05 0.02"></a-text>
      <a-text value="ankit_998877@yahoo.com  |  replies in 48 hrs" align="center" width="5.8"
              color="#9FE8D8" position="0 0.55 0.02"></a-text>
      <a-text value="Pune, India - remote friendly" align="center" width="5.6"
              color="#C7CFE3" position="0 0.15 0.02"></a-text>
      <a-text value="Pre-release clearance  |  Python sprints  |  Team training" align="center" width="5.8"
              color="#FFFFFF" position="0 -0.35 0.02"></a-text>
      <a-text value="Beyond keyboard: novels, table tennis and cricket, blogging" align="center" width="5.6"
              color="#C7CFE3" position="0 -0.9 0.02"></a-text>
      <a-text value="The best review is the one developers do not dread." align="center" width="5.4"
              color="#5C667D" position="0 -1.4 0.02"></a-text>
      <a-text value="Look down - you are standing in the profile." align="center" width="5"
              color="#5C667D" position="0 -1.78 0.02"></a-text>
    </a-entity>
  </a-scene>

  <script>
    setTimeout(function () {
      document.getElementById('hint').classList.add('hidden');
    }, 6000);
  </script>
</body>
</html>
